[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vecstore"
version = "0.1.0"
description = "Brute-force and HNSW vector indexes written from scratch in NumPy"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["vecstore"]
